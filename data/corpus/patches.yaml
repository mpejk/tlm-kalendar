# Corrections of the Latin corpus (data/corpus/la, imported from Divinum Officium), applied every time the corpus is loaded
# (src/assembler/corpus-node.ts). No import run and no copy of Divinum Officium is needed: edit this file and rebuild.
#   formulary: id of the Mass formulary, or "*" for every formulary that holds the text (texts of a Common are copied into many)
#   section:   section name (Oratio, Lectio, Graduale, Tractus, Evangelium, Offertorium, Secreta, Communio, Postcommunio ...) or "*"
#   find / replace: exact text as it stands in the corpus (with its accents) and what it becomes
#   source:    where the correct reading was checked. "MR 1962" = Missale Romanum, editio typica 1962 (scan of the Church Music
#              Association of America, missale62.pdf); printed page, then page of the PDF.
# A patch that matches nothing stops the build.

# --- T03 Assumption: the gradual of the Mass Signum magnum (1950) in the new Latin psalter
- { id: T03a, formulary: Sancti/08-15, section: Graduale, find: "et concupíscit rex decórem tuum.", replace: "et concupíscet Rex pulchritúdinem tuam.", source: "MR 1962, p. 628 (PDF 709)" }
- { id: T03b, formulary: Sancti/08-15, section: Graduale, find: "Omnis glória ejus fíliæ Regis ab intus, in fímbriis áureis circumamícta varietátibus.", replace: "Tota decóra ingréditur fília Regis, textúræ áureæ sunt amíctus ejus.", source: "MR 1962, p. 628 (PDF 709)" }
- { id: T03c, formulary: Sancti/08-15, section: Graduale, find: "Assumpta est María in cœlum", replace: "Assúmpta est María in cælum", source: "MR 1962, p. 628 (PDF 709)" }

# --- T04 All Souls: tract of the three Masses
- { id: T04, formulary: "*", section: Graduale, find: "Absólve, Dómine, ánimas ómnium fidélium ab omni vínculo delictórum.", replace: "Absólve, Dómine, ánimas ómnium fidélium defunctórum ab omni vínculo delictórum.", source: "MR 1962, pp. 706, 708 (PDF 787, 789)" }

