# Game "Poredaj evanđelje": for each Gospel of the round days, a passage of 3 or 4 consecutive sentences of that day's Croatian
# Gospel, which the child puts back in order. The passages were chosen by hand, by reading, so that the order is unambiguous
# (a narrative where each sentence follows from the one before, a question and its answer, an action and its result, sentences
# linked by "Tada", "A on", "Kad ...", "I reče im" ...); lists of sayings, parallel beatitudes and repeated formulas were avoided.
# Sentences over 170 characters, under 25 characters and the heading "Slijedi sveto Evanđelje po ..." are not used.
# The sentences themselves are NOT stored here: only the first words of the first sentence and the number of sentences. The build
# takes them from the calendar's Croatian Gospel (dist/data), split as scripts/igra/poredaj-cand.ts prints them, and stops if
# the first words are not found at the start of exactly one sentence.
# Key: the formulary of the Gospel. Value: [first words of the first sentence, number of sentences], or null where no passage
# of the Gospel allows an unambiguous order.
