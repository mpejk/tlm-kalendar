# Corrections of the Croatian texts shown on the site, applied by the build (scripts/croatian/corrections.ts) on top of the
# translation memory. Nothing here is a new translation: every entry is either a text that the old site or Kniewald prints
# elsewhere, wording supplied by a named person, or a mechanical correction (typo, Scripture reference, trimming to the Latin).
#
# Two kinds of entry:
#   - { id, la, hr, source, why }          the Croatian beside the Latin block `la` becomes `hr`
#                                          (`la` is matched without accents, case and punctuation; give the whole block)
#   - { id, find, replace, where, why }    in every Croatian cell containing `find` it becomes `replace`;
#                                          `where` (optional) limits it to formularies whose id starts with that text
# An entry that matches nothing stops the build. Every corrected typo is also listed in TYPOS.md with the original reading.

- id: T01
  la: "Accépta tibi sit, Dómine, sacrátæ plebis oblátio pro tuórum honóre Sanctórum: quorum se méritis de tribulatióne percepísse cognóscit auxílium."
  hr: |-
    Neka ti bude, Gospodine, drag ovaj prinos što ga tvoj sveti narod prikazuje, u čast tvojih svetih priznavajući da je po njihovim zaslugama primio pomoć u nevolji.
    <i>Po Gospodinu našemu Isusu Kristu, Sinu tvome: Koji s tobom živi i kraljuje u jedinstvu Duha Svetoga, Bog: po sve vijeke vjekova</i>.
  source: "tradicionalnamisa.com, npr. /kalendar/2017/propers/13122016_0.html (12 stranica)"
  why: "Stara stranica uz ovu prikaznu molitvu na 18 stranica tiska prijevod druge molitve (Hostias, Domine, tuae plebis intende: »Pogledaj, Gospodine, na darove svoga naroda…«), a na 12 stranica pravi prijevod. Pravilo »najčešći prijevod« izabralo je pogrešan."

