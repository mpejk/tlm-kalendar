# Known differences between the assembled Latin Masses and the harvested old-site pages. Each problem reported by
# scripts/verify/texts-lib.ts must match one entry (regular expression on "<date>_<n> <problem>").
- match: '-12-26_0 order'
  cause: "St Stephen: the old site says the Creed is not said; it is said on every day of the Christmas octave (Code of Rubrics n. 475d). The calendar follows the rubric."
- match: 'eloquiumvtum'
  cause: "Old-site typo (eloquiumvtum for eloquium tuum) in the offertory of Friday and Saturday after Ash Wednesday; corrected against Divinum Officium."
- match: 'qual oculis tue maiestatis oferimum'
  cause: "Old-site typos (qual, offerimum) in the secret of the 18th Sunday after Pentecost; corrected against Divinum Officium."
- match: 'heading Lectio'
  cause: "Old site labels the single prophetic lesson of some Ember Fridays Epístola and of others Léctio; the calendar uses Léctio whenever the reading is not from an Epistle."
- match: 'text Graduale .*propitius esto domine pecatis'
  cause: "Rogation Mass: the old site prints the Paschal Alleluia of the votive Mass for any necessity; the Missal's Rogation Mass has Alleluia. Confitemini Domino (Divinum Officium), which is kept."
- match: 'ovi sveti darovi'
  cause: "St Joseph the Worker: the old site has the Croatian postcommunion in the Latin column; Latin from Divinum Officium."
- match: 'rank line: old «Nedjelja I. razreda»'
  cause: "Ascension: the old site's rank line says Nedjelja (Sunday); it is a feast of I class."
- match: '-05-31_0 text Secreta'
  cause: "Queenship of Our Lady: for the commemoration of St Petronilla the old site repeats the secret of the feast; the calendar gives St Petronilla's own secret."
- match: '-08-28_0 text Graduale'
  cause: "St Augustine: the old site prints the verse Inveni David without Alleluia; Divinum Officium has Alleluia. Amavit eum. Kept from Divinum Officium (listed for review)."
- match: '-10-11_0 text Graduale'
  cause: "Maternity of Our Lady: the old site omits the word Alleluia around the verse; text otherwise the same."
- match: '-10-28_0 text (Graduale|Evangelium)'
  cause: "Sts Simon and Jude: the old site prints the Alleluia verse and Gospel of St James (Mt 20); the Missal has Nimis honorati and Jn 15, 17-25 (Divinum Officium)."
- match: '-02-22_0 text Offertorium'
  cause: "Chair of St Peter: the old site continues the offertory with 'et quodcumque ligaveris…'; the Missal's antiphon ends at 'claves regni caelorum' (Divinum Officium)."
- match: '-06-04_0 text Offertorium'
  cause: "St Francis Caracciolo: old site 'sicut cedrus Libani', Missal 'sicut cedrus, quae in Libano est' (Divinum Officium)."
- match: '-05-06_0 text Introitus'
  cause: "Saturday Mass of Our Lady in Paschaltide: the old site prints the antiphon three times."
- match: '-(04-13|03-29)_1 (order|missing section Other)'
  cause: "Holy Thursday evening Mass: the old site inserts the washing of the feet (antiphons) after the Gospel; the calendar shows the Mandatum with the rites of Holy Week."
# --- after the review of revision 25a6b7a
- match: '-08-15_0 text Graduale'
  cause: "Assumption: the old site prints the gradual in a third Latin version (quia concupivit rex speciem tuam / Omnis gloria eius), although its Croatian translates the text of the 1962 Missal. The calendar has the Missal's text (p. 628): concupiscet Rex pulchritudinem tuam / Tota decora ingreditur filia Regis (review finding T03)."
- match: 'text Communio .*beata viscera marie virginis'
  cause: "Saturday Mass of Our Lady in Paschaltide: the old site prints the communion antiphon without Alleluia; in Paschaltide Alleluia is added (Code of Rubrics n. 504; review finding T09)."
